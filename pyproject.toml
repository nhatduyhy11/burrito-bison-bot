[project]
name = "hauntedroom-bot"
version = "0.1.0"
description = "Playwright and OpenCV automation for Haunted Room"
readme = "docs/README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "playwright>=1.60.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
