<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Battle Sim Setup</title>
  <style>
    :root {
      --bg: #15171c; --panel: #1e2128; --line: #323743; --text: #e3e6ec; --muted: #8b93a3;
      --accent: #5aa9ff; --red: #ff6b6b; --gold: #f2c14e; --colorful: #c58cff; --ok: #5fd38d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 12px/1.45 "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    body { padding: 12px 16px 40px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0; }
    h2 { font-size: 13px; font-weight: 600; margin: 0; }
    .sub { color: var(--muted); margin: 0 0 12px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: 12px; align-items: start; }
    @media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { position: static; } }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
    section > header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    section > header .hint { color: var(--muted); font-size: 11px; }
    .accordion { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
    .accordion > summary { cursor: pointer; font-size: 13px; }
    .accordion > summary .hint { color: var(--muted); font-size: 11px; margin-left: 12px; }
    .accordion-body { margin-top: 8px; }
    .accordion-body > section { margin: 0; padding: 0; border: 0; }
    .body { margin-top: 8px; }
    .off .body { display: none; }
    strong { font-weight: 600; }
    .mount-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 8px 0; }
    .mount-group-title { display: block; margin-bottom: 5px; }
    .mount-options { display: grid; gap: 6px; }
    .mount-option { align-items: flex-start; min-width: 0; }
    .mount-option input { flex: none; margin-top: 2px; }
    .mount-option > span { min-width: 0; overflow-wrap: anywhere; }
    .mount-orange { grid-column: 1 / -1; }
    .mount-orange .mount-options { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; }
    .c-orange { color: #f0a15b; }
    .skin-picker { min-width: 0; max-width: 100%; white-space: nowrap; }
    .skin-picker select { min-width: 0; width: 260px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
    .building-skin-table { overflow-x: auto; }
    .card { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; overflow-x: auto; }
    label { display: inline-flex; align-items: center; gap: 4px; }
    select, input[type=number] { background: #111318; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; font: inherit; }
    input[type=number] { width: 58px; }
    select { max-width: 100%; }
    /* Anchor the skin menu to its field, independent of the selected option's index. */
    @supports (appearance: base-select) {
      .skin-picker select, .skin-picker select::picker(select) { appearance: base-select; }
      .skin-picker select { align-items: center; gap: 8px; }
      .skin-picker select::picker(select) {
        inset: auto;
        top: anchor(bottom);
        left: anchor(left);
        width: anchor-size(width);
        min-width: 0;
        max-width: calc(100vw - 24px);
        max-height: min(280px, 50vh);
        position-try-fallbacks: flip-block, flip-inline;
        margin: 4px 0;
        padding: 4px;
        background: #1e2128;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 8px 24px #0006;
        font: 12px/1.45 "Helvetica Neue", Arial, sans-serif;
      }
      .skin-picker option { padding: 6px 8px; border-radius: 3px; white-space: normal; overflow-wrap: anywhere; }
      .skin-picker option:checked { background: #283d55; }
      .skin-picker option:hover { background: #323743; }
      .skin-picker select::picker-icon { margin-left: auto; color: var(--muted); }
    }
    button { background: #2a2f3a; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
    .x { padding: 2px 8px; }
    table { border-collapse: collapse; width: 100%; margin-top: 4px; }
    th, td { text-align: left; padding: 3px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; font-size: 11px; }
    td.name { white-space: normal; }
    .en { color: var(--muted); font-size: 11px; }
    .tag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 3px; border: 1px solid currentColor; }
    .c-red { color: var(--red); } .c-gold { color: var(--gold); } .c-colorful { color: var(--colorful); } .c-default { color: var(--muted); }
    .note { color: var(--muted); font-size: 11px; }
    .warn { color: var(--gold); font-size: 11px; }
    .err { color: var(--red); }
    pre { background: #0f1115; border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 8px 0 0;
      max-height: 60vh; overflow: auto; font: 12px/1.4 Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
    .side { position: sticky; top: 12px; }
    code { font: 12px Consolas, monospace; background: #0f1115; padding: 1px 4px; border-radius: 3px; word-break: break-all; }
    .status { min-height: 1.4em; margin-top: 6px; }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Battle Sim Setup</h1>
    <button id="toggle-accordions" type="button" aria-controls="app" disabled>Thu gọn tất cả</button>
  </header>
  <p class="sub">Tạo profile cho <code>sandbox --play --profile</code>. Hero cần đủ 5 slot. Các phần có nút "Ghi đè" giữ dữ liệu capture khi tắt.</p>
  <div id="app">đang tải…</div>
  <script type="importmap">
    {
      "imports": {
        "preact": "/__sim/vendor/preact.module.js",
        "preact/hooks": "/__sim/vendor/preact-hooks.module.js",
        "htm": "/__sim/vendor/htm.module.js"
      }
    }
  </script>
  <script type="module" src="/__sim/setup/index.js"></script>
</body>
</html>
